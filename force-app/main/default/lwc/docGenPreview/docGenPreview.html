<template>
    <lightning-card title={cardTitle} icon-name="doctype:pdf">

        <!-- LOADING STATE -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-top_large">
                <div class="slds-is-relative" style="height:80px;">
                    <lightning-spinner
                        alternative-text="Generating document"
                        size="medium"
                        variant="brand">
                    </lightning-spinner>
                </div>
            </div>
            <div class="slds-align_absolute-center slds-p-bottom_large">
                <div class="slds-text-align_center">
                    <p class="slds-text-heading_small">Generating Your Document</p>
                    <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                        This may take up to 30 seconds. Please wait&hellip;
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        Elapsed: {elapsedSeconds}s
                    </p>
                </div>
            </div>
        </template>

        <!-- TIMEOUT STATE -->
        <template if:true={isTimedOut}>
            <div class="slds-p-around_large slds-text-align_center">
                <lightning-icon
                    icon-name="utility:clock"
                    size="large"
                    variant="warning">
                </lightning-icon>
                <p class="slds-text-heading_small slds-m-top_medium">Still Processing</p>
                <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                    The document is taking longer than expected.
                    Check the Files related list on this record shortly.
                </p>
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Check Again"
                        variant="brand"
                        onclick={handleCheckAgain}>
                    </lightning-button>
                </div>
            </div>
        </template>

        <!-- ERROR STATE -->
        <template if:true={isError}>
            <div class="slds-p-around_large slds-text-align_center">
                <lightning-icon
                    icon-name="utility:error"
                    size="large"
                    variant="error">
                </lightning-icon>
                <p class="slds-text-heading_small slds-m-top_medium">Generation Failed</p>
                <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                    {errorMessage}
                </p>
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Try Again"
                        variant="neutral"
                        onclick={handleRetry}>
                    </lightning-button>
                </div>
            </div>
        </template>

        <!-- SUCCESS STATE (slim confirmation — File Preview renders below) -->
        <template if:true={isComplete}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-theme_success" role="status">
                    <lightning-icon
                        icon-name="utility:success"
                        variant="inverse"
                        size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <h2>Document generated successfully.</h2>
                </div>
            </div>
        </template>

    </lightning-card>
</template>
